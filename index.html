<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 INTER GAMES - A Batalha dos 100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            color: #FF5722;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #CCC;
            margin-bottom: 10px;
        }

        .last-update {
            font-size: 0.9em;
            color: #999;
            margin-top: 10px;
        }

        .categories-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .category-box {
            background: rgba(255, 87, 34, 0.1);
            border: 2px solid #FF5722;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.2);
        }

        .category-title {
            background: #FF5722;
            color: #fff;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 15px;
            text-align: center;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            border-left: 4px solid #FF5722;
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            background: rgba(255, 87, 34, 0.2);
            transform: translateX(5px);
        }

        .position {
            font-size: 1.5em;
            font-weight: bold;
            min-width: 40px;
            text-align: center;
            margin-right: 12px;
        }

        .medal {
            font-size: 1.8em;
            margin-right: 8px;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1em;
            margin-bottom: 3px;
        }

        .team-time {
            font-size: 0.85em;
            color: #FF5722;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #FF5722;
        }

        .refresh-info {
            text-align: center;
            color: #999;
            margin-top: 40px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .categories-container {
                grid-template-columns: 1fr;
            }
        }

        .gold { color: #FFD700; }
        .silver { color: #C0C0C0; }
        .bronze { color: #CD7F32; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 INTER GAMES experience</h1>
            <h2 class="subtitle">A Batalha dos 100 - Roque Box Goiânia</h2>
            <div class="last-update" id="lastUpdate">Carregando dados...</div>
        </header>

        <div id="rankingContainer" class="categories-container">
            <div class="loading">Carregando dados do Google Sheets...</div>
        </div>

        <div class="refresh-info">
            ⏱️ Atualiza automaticamente a cada 30 minutos<br>
            📊 Dados originários de Google Sheets
        </div>
    </div>

    <script>
        const SHEET_ID = '1tDjZCAdXNvXT2ImVYybGol40zz4Dl1x';
        const CATEGORIES = [
            "Full Feminino",
            "Full Masculino",
            "Full Misto",
            "Revezamento Feminino",
            "Revezamento Masculino",
            "Revezamento Misto",
            "Short Feminino",
            "Short Masculino",
            "Short Misto"
        ];

        // Converter tempo MM:SS em segundos para ordenar
        function timeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            return parseInt(parts[0]) * 60 + parseInt(parts[1]);
        }

        // Buscar dados do Google Sheets
        async function fetchData() {
            try {
                const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Resultados`;
                
                const response = await fetch(url);
                const csv = await response.text();
                
                const lines = csv.split('\n');
                const data = [];

                // Pular header (linha 0)
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    const parts = lines[i].split(',');
                    if (parts.length >= 4 && parts[0]) {
                        data.push({
                            id: parts[0].trim(),
                            equipe: parts[1].trim(),
                            categoria: parts[2].trim(),
                            tempo: parts[3].trim(),
                            status: parts[4] ? parts[4].trim() : ""
                        });
                    }
                }

                renderRanking(data);
                updateLastModified();
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('rankingContainer').innerHTML = 
                    '<div class="no-data">❌ Erro ao carregar dados. Tente atualizar a página.</div>';
            }
        }

        // Renderizar ranking
        function renderRanking(data) {
            const container = document.getElementById('rankingContainer');
            container.innerHTML = '';

            for (const category of CATEGORIES) {
                const categoryData = data
                    .filter(row => row.categoria === category && row.status === "Finalizado")
                    .sort((a, b) => timeToSeconds(a.tempo) - timeToSeconds(b.tempo));

                const categoryBox = document.createElement('div');
                categoryBox.className = 'category-box';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = category;
                categoryBox.appendChild(titleDiv);

                if (categoryData.length === 0) {
                    const noData = document.createElement('div');
                    noData.className = 'no-data';
                    noData.textContent = 'Sem dados ainda';
                    categoryBox.appendChild(noData);
                } else {
                    categoryData.forEach((row, index) => {
                        const position = index + 1;
                        let medal = '';
                        let medalClass = '';

                        if (position === 1) {
                            medal = '🥇';
                            medalClass = 'gold';
                        } else if (position === 2) {
                            medal = '🥈';
                            medalClass = 'silver';
                        } else if (position === 3) {
                            medal = '🥉';
                            medalClass = 'bronze';
                        }

                        const item = document.createElement('div');
                        item.className = 'ranking-item';
                        item.innerHTML = `
                            <div class="position ${medalClass}">
                                <span class="medal">${medal}</span>${position}º
                            </div>
                            <div class="team-info">
                                <div class="team-name">${row.equipe}</div>
                                <div class="team-time">⏱️ ${row.tempo}</div>
                            </div>
                        `;
                        categoryBox.appendChild(item);
                    });
                }

                container.appendChild(categoryBox);
            }
        }

        // Atualizar hora da última sincronização
        function updateLastModified() {
            const now = new Date();
            const time = now.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').textContent = `✅ Atualizado em ${time}`;
        }

        // Carregar dados ao abrir a página
        fetchData();

        // Atualizar a cada 30 minutos (1800000 ms)
        setInterval(fetchData, 30 * 60 * 1000);

        // Também atualizar a cada 5 minutos para teste (descomentar para teste)
        // setInterval(fetchData, 5 * 60 * 1000);
    </script>
</body>
</html>
