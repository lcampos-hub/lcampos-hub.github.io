<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 INTER GAMES - A Batalha dos 100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1A1A1A;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 3px solid #FF5722;
            padding-bottom: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #FF5722;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #CCC;
            margin-bottom: 10px;
        }

        .last-update {
            font-size: 0.9em;
            color: #00FF00;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-label {
            color: #FF5722;
            font-weight: bold;
            font-size: 1em;
            text-transform: uppercase;
        }

        select {
            padding: 10px 15px;
            font-size: 0.95em;
            border: 2px solid #FF5722;
            background: #2D2D2D;
            color: #FF5722;
            border-radius: 3px;
            cursor: pointer;
            min-width: 200px;
            font-weight: bold;
        }

        select:hover {
            background: #3D3D3D;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.5);
        }

        select option {
            background: #2D2D2D;
            color: #FF5722;
        }

        .table-container {
            background: #2D2D2D;
            border: 2px solid #FF5722;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #FF5722;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.9em;
            letter-spacing: 1px;
        }

        th {
            padding: 15px;
            text-align: left;
            border-right: 1px solid #fff;
        }

        th:last-child {
            border-right: none;
        }

        tbody tr {
            border-bottom: 1px solid #444;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        tbody tr:hover {
            background-color: rgba(255, 87, 34, 0.15);
        }

        tbody tr.expanded {
            background-color: rgba(255, 87, 34, 0.25);
        }

        td {
            padding: 15px;
            border-right: 1px solid #444;
        }

        td:last-child {
            border-right: none;
        }

        .rank {
            font-weight: bold;
            font-size: 1.2em;
            color: #FF5722;
            text-align: center;
        }

        .rank.first {
            font-size: 1.4em;
            color: #FFD700;
        }

        .rank.second {
            color: #C0C0C0;
        }

        .rank.third {
            color: #CD7F32;
        }

        .medal {
            display: inline-block;
            margin-right: 8px;
            font-size: 1.1em;
        }

        .team-name {
            font-weight: bold;
            font-size: 1em;
            color: #FFF;
        }

        .category {
            color: #FF5722;
            font-size: 0.9em;
            margin-top: 3px;
        }

        .time {
            font-weight: bold;
            font-size: 1em;
            color: #00FF00;
            text-align: center;
        }

        .points {
            font-weight: bold;
            font-size: 1.1em;
            color: #FFD700;
            text-align: center;
        }

        .expand-icon {
            color: #FF5722;
            font-size: 1.2em;
        }

        .details-row {
            display: none;
            background-color: rgba(255, 87, 34, 0.1);
        }

        .details-row.show {
            display: table-row;
        }

        .details-content {
            padding: 20px;
            text-align: center;
        }

        .athletes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .athlete {
            background: rgba(255, 87, 34, 0.2);
            padding: 15px;
            border-radius: 5px;
            border-left: 3px solid #FF5722;
        }

        .athlete-label {
            font-size: 0.8em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .athlete-name {
            font-weight: bold;
            font-size: 1.1em;
            color: #FFF;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1.1em;
        }

        .refresh-info {
            text-align: center;
            color: #999;
            font-size: 0.9em;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            table {
                font-size: 0.85em;
            }

            th, td {
                padding: 10px;
            }

            .controls {
                flex-direction: column;
            }

            select {
                min-width: 100%;
            }

            .athletes {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 INTER GAMES experience</h1>
            <h2 class="subtitle">A Batalha dos 100 - Roque Box Goiânia</h2>
            <div class="last-update" id="lastUpdate">⏳ Carregando dados...</div>
        </header>

        <div class="controls">
            <label class="control-label">Categoria:</label>
            <select id="categorySelect" onchange="updateDisplay()">
                <option value="">-- Todas as Categorias --</option>
            </select>
        </div>

        <div class="table-container">
            <table id="rankingTable">
                <thead>
                    <tr>
                        <th style="width: 8%;">Rank</th>
                        <th style="width: 30%;">Equipe</th>
                        <th style="width: 25%;">Categoria</th>
                        <th style="width: 20%;">Tempo</th>
                        <th style="width: 12%;">Pontos</th>
                        <th style="width: 5%; text-align: center;">+</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>

            <div id="noData" class="no-data" style="display:none;">
                📋 Nenhum resultado finalizado ainda
            </div>
        </div>

        <div class="refresh-info">
            🔄 Atualiza automaticamente a cada 30 segundos
        </div>
    </div>

    <script>
        // URL do CSV publicado
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ8rMHFvBx4d4nC7sytJYKZ4RXIJdzktA4EgyG_LAiYiIXh_Sv6GFO9DUXQNJIgQ/pub?gid=259301029&single=true&output=csv';
        
        const CATEGORIES = [
            "Full Feminino",
            "Full Masculino",
            "Full Misto",
            "Revezamento Feminino",
            "Revezamento Masculino",
            "Revezamento Misto",
            "Short Feminino",
            "Short Masculino",
            "Short Misto"
        ];

        let allData = [];
        let expandedRow = null;

        // Converter tempo MM:SS em segundos para ordenar
        function timeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            const minutes = parseInt(parts[0]) || 0;
            const seconds = parseInt(parts[1]) || 0;
            return minutes * 60 + seconds;
        }

        // Calcular pontos (100, 95, 90, 85...)
        function calculatePoints(position) {
            if (position === 1) return 100;
            if (position === 2) return 95;
            if (position === 3) return 90;
            return Math.max(0, 100 - (position - 1) * 5);
        }

        // Buscar dados via CSV
        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                
                const lines = csv.split('\n');
                allData = [];
                
                // Pular header (linha 0)
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    const parts = lines[i].split(',');
                    if (parts.length >= 5 && parts[0]) {
                        allData.push({
                            id: parts[0].trim(),
                            equipe: parts[1].trim(),
                            categoria: parts[2].trim(),
                            tempo: parts[3].trim(),
                            status: parts[4] ? parts[4].trim() : '',
                            atleta1: parts[5] ? parts[5].trim() : 'N/A',
                            atleta2: parts[6] ? parts[6].trim() : 'N/A'
                        });
                    }
                }
                
                populateDropdown();
                updateLastModified();
                
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('lastUpdate').textContent = `❌ Erro ao carregar. Tentando novamente...`;
            }
        }

        // Preencher dropdown com categorias
        function populateDropdown() {
            const select = document.getElementById('categorySelect');
            const currentValue = select.value;
            
            // Limpar opções antigas (manter a primeira)
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar categorias que têm dados
            const categoriasComDados = new Set();
            allData.forEach(item => {
                if (item.categoria && item.status === "Finalizado") {
                    categoriasComDados.add(item.categoria);
                }
            });

            // Ordenar por ordem das CATEGORIES
            CATEGORIES.forEach(cat => {
                if (categoriasComDados.has(cat)) {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                }
            });

            // Restaurar valor anterior
            select.value = currentValue;
        }

        // Atualizar display
        function updateDisplay() {
            const categorySelect = document.getElementById('categorySelect');
            const selectedCategory = categorySelect.value;

            let categoryData = allData.filter(row => row.status === "Finalizado");

            if (selectedCategory) {
                categoryData = categoryData.filter(row => row.categoria === selectedCategory);
            }

            // Ordenar por tempo
            categoryData.sort((a, b) => timeToSeconds(a.tempo) - timeToSeconds(b.tempo));

            // Renderizar tabela
            const tableBody = document.getElementById('tableBody');
            const noData = document.getElementById('noData');

            if (categoryData.length === 0) {
                tableBody.innerHTML = '';
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            tableBody.innerHTML = '';

            categoryData.forEach((row, index) => {
                const position = index + 1;
                const points = calculatePoints(position);
                let medal = '';
                let rankClass = '';

                if (position === 1) {
                    medal = '🥇';
                    rankClass = 'first';
                } else if (position === 2) {
                    medal = '🥈';
                    rankClass = 'second';
                } else if (position === 3) {
                    medal = '🥉';
                    rankClass = 'third';
                }

                const mainRow = document.createElement('tr');
                mainRow.innerHTML = `
                    <td class="rank ${rankClass}">
                        <span class="medal">${medal}</span>${position}
                    </td>
                    <td>
                        <div class="team-name">${row.equipe}</div>
                        <div class="category">${row.categoria}</div>
                    </td>
                    <td>
                        <div class="category">${row.categoria}</div>
                    </td>
                    <td class="time">⏱️ ${row.tempo}</td>
                    <td class="points">${points}</td>
                    <td style="text-align: center;">
                        <span class="expand-icon" onclick="toggleDetails(event, this)">▼</span>
                    </td>
                `;

                mainRow.onclick = (e) => {
                    if (e.target.classList.contains('expand-icon')) return;
                    toggleDetails(e, mainRow.querySelector('.expand-icon'));
                };

                tableBody.appendChild(mainRow);

                // Linha de detalhes
                const detailsRow = document.createElement('tr');
                detailsRow.className = 'details-row';
                detailsRow.innerHTML = `
                    <td colspan="6">
                        <div class="details-content">
                            <div class="athletes">
                                <div class="athlete">
                                    <div class="athlete-label">Atleta 1</div>
                                    <div class="athlete-name">${row.atleta1}</div>
                                </div>
                                <div class="athlete">
                                    <div class="athlete-label">Atleta 2</div>
                                    <div class="athlete-name">${row.atleta2}</div>
                                </div>
                            </div>
                        </div>
                    </td>
                `;

                tableBody.appendChild(detailsRow);
                mainRow.detailsRow = detailsRow;
            });
        }

        // Toggle detalhes
        function toggleDetails(event, icon) {
            const row = event.currentTarget || icon.closest('tr');
            const detailsRow = row.detailsRow;

            if (expandedRow && expandedRow !== row) {
                expandedRow.classList.remove('expanded');
                expandedRow.detailsRow.classList.remove('show');
            }

            if (!detailsRow) return;

            if (detailsRow.classList.contains('show')) {
                detailsRow.classList.remove('show');
                row.classList.remove('expanded');
                expandedRow = null;
            } else {
                detailsRow.classList.add('show');
                row.classList.add('expanded');
                expandedRow = row;
            }
        }

        // Atualizar hora da última sincronização
        function updateLastModified() {
            const now = new Date();
            const time = now.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').textContent = `✅ Atualizado em ${time}`;
        }

        // Carregar dados ao abrir a página
        fetchData();

        // Atualizar a cada 30 segundos (30000 ms)
        setInterval(fetchData, 30 * 1000);
    </script>
</body>
</html>
