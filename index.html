<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 INTER GAMES - Evento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1A1A1A;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #FF5722;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8em;
            color: #FF5722;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95em;
            color: #CCC;
            margin-bottom: 10px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid #FF5722;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #2D2D2D;
            border: 2px solid #FF5722;
            color: #FF5722;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 3px 3px 0 0;
            font-size: 0.95em;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #FF5722;
            color: #fff;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* TIMELINE TABLE */
        .timeline-table-container {
            background: #2D2D2D;
            border: 2px solid #FF5722;
            border-radius: 5px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .timeline-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .timeline-table thead {
            background: #FF5722;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.85em;
        }

        .timeline-table th {
            padding: 12px;
            text-align: left;
            font-size: 0.75em;
        }

        .timeline-table tbody tr {
            border-bottom: 1px solid #444;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        .timeline-table tbody tr:hover {
            background-color: rgba(255, 87, 34, 0.15);
        }

        .timeline-table td {
            padding: 10px 8px;
            word-break: break-word;
            font-size: 0.9em;
        }

        .timeline-equipe {
            font-weight: bold;
            color: #FF5722;
        }

        .timeline-horario {
            color: #FFD700;
            font-weight: bold;
        }

        .timeline-bateria-col {
            color: #A8D5A8;
        }

        .timeline-expand-table-btn {
            background: #FF5722;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }

        .timeline-expand-table-btn:hover {
            background: #E64A19;
        }

        .timeline-row-details {
            display: none;
            background: rgba(255, 87, 34, 0.1);
            padding: 12px;
            border-left: 3px solid #FF5722;
        }

        .timeline-row-details.show {
            display: block;
        }

        .timeline-athlete-detail {
            color: #A8D5A8;
            font-size: 0.9em;
            margin: 5px 0;
        }

        /* LEADERBOARD */
        .leaderboard-controls {
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }

        .control-label {
            color: #FF5722;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        select {
            padding: 10px 12px;
            font-size: 0.9em;
            border: 2px solid #FF5722;
            background: #2D2D2D;
            color: #FF5722;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(255, 87, 34, 0.5);
        }

        .leaderboard-container {
            background: #2D2D2D;
            border: 2px solid #FF5722;
            border-radius: 5px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        thead {
            background: #FF5722;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.85em;
        }

        th {
            padding: 12px;
            text-align: left;
            font-size: 0.75em;
        }

        tbody tr {
            border-bottom: 1px solid #444;
            transition: background-color 0.2s;
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: rgba(255, 87, 34, 0.15);
        }

        td {
            padding: 10px 8px;
            word-break: break-word;
            font-size: 0.9em;
        }

        .rank {
            font-weight: bold;
            font-size: 1.1em;
            color: #FF5722;
            text-align: center;
        }

        .rank.first {
            color: #FFD700;
            font-size: 1.3em;
        }

        .rank.second {
            color: #C0C0C0;
        }

        .rank.third {
            color: #CD7F32;
        }

        .team-name {
            font-weight: bold;
        }

        .time {
            color: #A8D5A8;
            font-weight: bold;
        }

        .points {
            color: #FFD700;
            font-weight: bold;
            text-align: center;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-finalizado {
            background: #90EE90;
            color: #000;
        }

        .status-aguardando {
            background: #FFA500;
            color: #000;
        }

        .leaderboard-details {
            display: none;
            background: rgba(255, 87, 34, 0.1);
            padding: 12px;
            margin-top: 8px;
            border-left: 3px solid #FF5722;
            border-radius: 3px;
        }

        .leaderboard-details.show {
            display: block;
        }

        .athlete-detail {
            color: #A8D5A8;
            font-size: 0.9em;
            margin: 5px 0;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .event-info {
            background: rgba(255, 87, 34, 0.1);
            border: 1px solid #FF5722;
            border-radius: 5px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .event-info-item {
            display: inline-block;
            margin-right: 30px;
            margin-bottom: 10px;
        }

        .event-info-label {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
        }

        .event-info-value {
            font-weight: bold;
            color: #FF5722;
            font-size: 1.1em;
        }

        @media (max-width: 768px) {
            .tabs {
                flex-direction: column;
            }

            .tab-btn {
                width: 100%;
            }

            .timeline::before {
                left: 20px;
            }

            .timeline-item {
                padding-left: 80px;
            }

            .timeline-dot {
                left: 5px;
                width: 25px;
                height: 25px;
            }

            table {
                font-size: 0.85em;
                min-width: 500px;
            }

            th {
                padding: 8px 4px;
                font-size: 0.7em;
            }

            td {
                padding: 8px 4px;
            }

            .event-info-item {
                display: block;
                margin-bottom: 15px;
            }

            .leaderboard-controls {
                flex-direction: column;
                align-items: flex-start;
            }

            select {
                width: 100%;
            }

            .leaderboard-container {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 INTER GAMES experience</h1>
            <h2 class="subtitle">A Batalha dos 100 - Roque Box Goiânia</h2>
        </header>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('timeline')">📅 Timeline</button>
            <button class="tab-btn" onclick="switchTab('leaderboard')">🏅 Leaderboard</button>
        </div>

        <!-- TAB: TIMELINE -->
        <div id="timeline" class="tab-content active">
            <div class="event-info">
                <div class="event-info-item">
                    <div class="event-info-label">Data</div>
                    <div class="event-info-value">02 de Agosto de 2026</div>
                </div>
                <div class="event-info-item">
                    <div class="event-info-label">Local</div>
                    <div class="event-info-value">Roque Box Goiânia</div>
                </div>
                <div class="event-info-item">
                    <div class="event-info-label">Total de Duplas</div>
                    <div class="event-info-value">21</div>
                </div>
            </div>

            <div class="timeline-table-container">
                <table class="timeline-table">
                    <thead>
                        <tr>
                            <th style="width: 12%;">Horário</th>
                            <th style="width: 30%;">Equipe</th>
                            <th style="width: 15%;">Categoria</th>
                            <th style="width: 12%;">Bateria</th>
                            <th style="width: 5%; text-align: center;">+</th>
                        </tr>
                    </thead>
                    <tbody id="timelineContent">
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB: LEADERBOARD -->
        <div id="leaderboard" class="tab-content">
            <div class="leaderboard-controls">
                <label class="control-label">Categoria:</label>
                <select id="categorySelect" onchange="updateLeaderboard()">
                    <option value="">-- Selecione uma categoria --</option>
                </select>
            </div>

            <div class="leaderboard-container">
                <table id="leaderboardTable">
                    <thead>
                        <tr>
                            <th style="width: 8%;">Rank</th>
                            <th style="width: 30%;">Equipe</th>
                            <th style="width: 15%;">Tempo</th>
                            <th style="width: 12%;">Pontos</th>
                            <th style="width: 15%;">Status</th>
                            <th style="width: 5%; text-align: center;">+</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardBody">
                    </tbody>
                </table>

                <div id="leaderboardNoData" class="no-data" style="display:none;">
                    📋 Selecione uma categoria para ver os resultados
                </div>
            </div>
        </div>
    </div>

    <script>
        // URL do CSV com cache busting - ABA TIMELINE
        function getTimelineCSVUrl() {
            const baseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ8rMHFvBx4d4nC7sytJYKZ4RXIJdzktA4EgyG_LAiYiIXh_Sv6GFO9DUXQNJIgQ/pub?gid=1612636754&single=true&output=csv';
            const timestamp = new Date().getTime();
            return `${baseUrl}&t=${timestamp}`;
        }

        // URL do CSV com cache busting - ABA RESULTADOS
        function getResultadosCSVUrl() {
            const baseUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ8rMHFvBx4d4nC7sytJYKZ4RXIJdzktA4EgyG_LAiYiIXh_Sv6GFO9DUXQNJIgQ/pub?gid=259301029&single=true&output=csv';
            const timestamp = new Date().getTime();
            return `${baseUrl}&t=${timestamp}`;
        }

        let allData = [];
        let timelineData = [];
        let expandedTeam = null;

        const CATEGORIES = [
            "Full Masculino",
            "Revezamento Masculino",
            "Short Masculino",
            "Full Misto",
            "Revezamento Misto",
            "Short Misto",
            "Full Feminino",
            "Revezamento Feminino",
            "Short Feminino",
            "Kids"
        ];

        // GERAR TIMELINE A PARTIR DO CSV
        async function fetchTimelineFromCSV() {
            try {
                const response = await fetch(getTimelineCSVUrl());
                const csv = await response.text();
                const lines = csv.split('\n');

                timelineData = [];
                let index = 0;

                // Pular header (linha 0)
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;

                    const parts = lines[i].split(',');
                    if (parts.length >= 2 && parts[0]) {
                        const nomeEquipe = parts[1].trim();
                        const categoria = parts[2] ? parts[2].trim() : '';
                        const atleta1 = parts[3] ? parts[3].trim() : '';
                        const atleta2 = parts[4] ? parts[4].trim() : '';
                        const bateria = parts[5] ? parts[5].trim() : '';
                        const horario = parts[6] ? parts[6].trim() : '';
                        const intervalo = parts[7] ? parts[7].trim() : '';
                        const descricao = nomeEquipe;

                        const isPause = descricao.toLowerCase().includes('intervalo') || intervalo.toLowerCase().includes('sim');

                        if (isPause) {
                            timelineData.push({
                                time: horario,
                                content: descricao,
                                isPause: true,
                                index: index++
                            });
                        } else {
                            timelineData.push({
                                time: horario,
                                nomeEquipe: descricao,
                                category: categoria || 'N/A',
                                bateria: bateria || 'N/A',
                                atleta1: atleta1 || 'N/A',
                                atleta2: atleta2 || 'N/A',
                                isPause: false,
                                index: index++
                            });
                        }
                    }
                }

                renderTimelineFromData();
            } catch (error) {
                console.error('Erro ao carregar timeline:', error);
            }
        }

        function renderTimelineFromData() {
            const timelineHtml = document.getElementById('timelineContent');
            timelineHtml.innerHTML = '';

            timelineData.forEach((item, index) => {
                if (item.isPause) {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td colspan="5" style="text-align: center; background: #333; color: #FFD700; font-weight: bold;">
                            ☕ ${item.content}
                        </td>
                    `;
                    timelineHtml.appendChild(tr);
                } else {
                    const teamKey = `${item.nomeEquipe}-${index}`;
                    const isExpanded = expandedTeam === teamKey;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="timeline-horario">${item.time}</td>
                        <td class="timeline-equipe">${item.nomeEquipe}</td>
                        <td>${item.category}</td>
                        <td class="timeline-bateria-col">${item.bateria}</td>
                        <td style="text-align: center;">
                            <button class="timeline-expand-table-btn" onclick="toggleTimelineDetails('${teamKey}')">
                                ${isExpanded ? '−' : '+'}
                            </button>
                        </td>
                    `;
                    timelineHtml.appendChild(tr);

                    // Adicionar linha de detalhes
                    if (isExpanded) {
                        const detailsTr = document.createElement('tr');
                        detailsTr.className = 'timeline-row-details show';
                        detailsTr.innerHTML = `
                            <td colspan="5">
                                <div class="timeline-athlete-detail">👤 Atleta 1: ${item.atleta1}</div>
                                <div class="timeline-athlete-detail">👤 Atleta 2: ${item.atleta2}</div>
                            </td>
                        </tr>
                        `;
                        timelineHtml.appendChild(detailsTr);
                    }
                }
            });
        }

        function toggleTimelineDetails(teamKey) {
            expandedTeam = expandedTeam === teamKey ? null : teamKey;
            renderTimelineFromData();
        }

        // BUSCAR E RENDERIZAR LEADERBOARD
        async function fetchLeaderboardData() {
            try {
                const response = await fetch(getResultadosCSVUrl());
                const csv = await response.text();

                const lines = csv.split('\n');
                allData = [];

                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;

                    const parts = lines[i].split(',');
                    if (parts.length >= 5 && parts[0]) {
                        allData.push({
                            id: parts[0].trim(),
                            equipe: parts[1].trim(),
                            categoria: parts[2].trim(),
                            tempo: parts[3].trim(),
                            status: parts[4] ? parts[4].trim() : '',
                            atleta1: parts[5] ? parts[5].trim() : 'N/A',
                            atleta2: parts[6] ? parts[6].trim() : 'N/A'
                        });
                    }
                }

                populateCategories();
                updateLeaderboard();
            } catch (error) {
                console.error('Erro ao carregar leaderboard:', error);
            }
        }

        function populateCategories() {
            const select = document.getElementById('categorySelect');
            const currentValue = select.value;

            while (select.options.length > 1) {
                select.remove(1);
            }

            const categoriasComDados = new Set();
            allData.forEach(item => {
                if (item.categoria && item.status === "Finalizado") {
                    categoriasComDados.add(item.categoria);
                }
            });

            CATEGORIES.forEach(cat => {
                if (categoriasComDados.has(cat)) {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                }
            });

            select.value = currentValue;
        }

        function timeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            const minutes = parseInt(parts[0]) || 0;
            const seconds = parseInt(parts[1]) || 0;
            return minutes * 60 + seconds;
        }

        function calculatePoints(position) {
            if (position === 1) return 100;
            if (position === 2) return 95;
            if (position === 3) return 90;
            return Math.max(0, 100 - (position - 1) * 5);
        }

        function updateLeaderboard() {
            const categorySelect = document.getElementById('categorySelect');
            const selectedCategory = categorySelect.value;

            const tbody = document.getElementById('leaderboardBody');
            const noData = document.getElementById('leaderboardNoData');

            if (!selectedCategory) {
                tbody.innerHTML = '';
                noData.style.display = 'block';
                return;
            }

            const finalizados = allData
                .filter(row => row.categoria === selectedCategory && row.status === "Finalizado")
                .sort((a, b) => timeToSeconds(a.tempo) - timeToSeconds(b.tempo));

            const naoFinalizados = allData
                .filter(row => row.categoria === selectedCategory && row.status !== "Finalizado");

            const allRows = [...finalizados, ...naoFinalizados];

            if (allRows.length === 0) {
                tbody.innerHTML = '';
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            tbody.innerHTML = '';

            allRows.forEach((row, index) => {
                const isFinalized = row.status === "Finalizado";
                const position = isFinalized ? finalizados.indexOf(row) + 1 : null;
                const points = isFinalized ? calculatePoints(position) : 0;

                let rankDisplay = '-';
                let rankClass = '';
                let medal = '';

                if (isFinalized) {
                    if (position === 1) {
                        medal = '🥇 ';
                        rankClass = 'first';
                    } else if (position === 2) {
                        medal = '🥈 ';
                        rankClass = 'second';
                    } else if (position === 3) {
                        medal = '🥉 ';
                        rankClass = 'third';
                    }
                    rankDisplay = medal + position;
                }

                const statusClass = isFinalized ? 'status-finalizado' : 'status-aguardando';
                const statusText = isFinalized ? 'Finalizado' : 'Aguardando';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="rank ${rankClass}">${rankDisplay}</td>
                    <td class="team-name">${row.equipe}</td>
                    <td class="time">${row.tempo || '⏳'}</td>
                    <td class="points">${isFinalized ? points : '-'}</td>
                    <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                    <td style="text-align: center;">
                        <button class="timeline-expand-btn" onclick="toggleLeaderboardDetails(this, '${index}')">+</button>
                    </td>
                `;

                // Adicionar linha de detalhes
                const detailsTr = document.createElement('tr');
                detailsTr.className = 'leaderboard-details';
                detailsTr.innerHTML = `
                    <td colspan="6">
                        <div class="athlete-detail">👤 Atleta 1: ${row.atleta1}</div>
                        <div class="athlete-detail">👤 Atleta 2: ${row.atleta2}</div>
                    </td>
                </tr>
                `;

                tbody.appendChild(tr);
                tbody.appendChild(detailsTr);
                tr.detailsRow = detailsTr;
                tr.expandBtn = tr.querySelector('button');
            });
        }

        function toggleLeaderboardDetails(btn, index) {
            const row = btn.closest('tr');
            const detailsRow = row.nextElementSibling;

            if (detailsRow && detailsRow.classList.contains('leaderboard-details')) {
                detailsRow.classList.toggle('show');
                btn.textContent = detailsRow.classList.contains('show') ? '−' : '+';
            }
        }

        // SWITCH TABS
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // INICIALIZAR
        window.onload = () => {
            fetchTimelineFromCSV();
            fetchLeaderboardData();
            setInterval(fetchLeaderboardData, 30 * 1000);
        };
    </script>
</body>
</html>
