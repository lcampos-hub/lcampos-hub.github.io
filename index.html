<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 INTER GAMES - A Batalha dos 100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #1A1A1A;
            color: #fff;
            padding: 15px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid #FF5722;
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.8em;
            color: #FF5722;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.95em;
            color: #CCC;
            margin-bottom: 10px;
        }

        .last-update {
            font-size: 0.85em;
            color: #00FF00;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-label {
            color: #FF5722;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        select {
            padding: 10px 12px;
            font-size: 0.9em;
            border: 2px solid #FF5722;
            background: #2D2D2D;
            color: #FF5722;
            border-radius: 3px;
            cursor: pointer;
            min-width: 180px;
            font-weight: bold;
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 8px rgba(255, 87, 34, 0.5);
        }

        /* Desktop: Tabela */
        .table-container {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #FF5722;
            color: #fff;
            text-transform: uppercase;
            font-weight: bold;
            font-size: 0.85em;
        }

        th {
            padding: 12px;
            text-align: left;
        }

        tbody tr {
            border-bottom: 1px solid #444;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        tbody tr:hover {
            background-color: rgba(255, 87, 34, 0.15);
        }

        td {
            padding: 12px;
        }

        /* Mobile: Cards */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background: #2D2D2D;
            border: 2px solid #FF5722;
            border-radius: 5px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .card:active {
            background-color: rgba(255, 87, 34, 0.25);
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .rank-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
            font-size: 1.3em;
        }

        .rank-badge.first {
            color: #FFD700;
        }

        .rank-badge.second {
            color: #C0C0C0;
        }

        .rank-badge.third {
            color: #CD7F32;
        }

        .medal {
            font-size: 1.2em;
        }

        .expand-btn {
            background: #FF5722;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.2s;
        }

        .expand-btn:active {
            background: #E64A19;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #FFF;
            margin-bottom: 5px;
        }

        .card-subtitle {
            color: #FF5722;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .card-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .info-item {
            background: rgba(255, 87, 34, 0.1);
            padding: 8px;
            border-radius: 3px;
            border-left: 3px solid #FF5722;
        }

        .info-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .info-value {
            font-weight: bold;
            font-size: 0.95em;
            color: #00FF00;
        }

        .info-value.points {
            color: #FFD700;
        }

        .card-details {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #444;
        }

        .card-details.show {
            display: block;
        }

        .athletes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .athlete {
            background: rgba(255, 87, 34, 0.15);
            padding: 10px;
            border-radius: 3px;
            border-left: 3px solid #FF5722;
        }

        .athlete-label {
            font-size: 0.75em;
            color: #999;
            text-transform: uppercase;
            margin-bottom: 3px;
        }

        .athlete-name {
            font-weight: bold;
            font-size: 0.9em;
            color: #FFF;
        }

        .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-size: 1em;
        }

        .refresh-info {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 20px;
        }

        /* Responsivo */
        @media (min-width: 1024px) {
            h1 {
                font-size: 2.2em;
            }

            .table-container {
                display: block;
            }

            .cards-container {
                display: none;
            }
        }

        @media (max-width: 600px) {
            .athletes-grid {
                grid-template-columns: 1fr;
            }

            .control-label {
                width: 100%;
            }

            select {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 INTER GAMES</h1>
            <h2 class="subtitle">A Batalha dos 100 - Roque Box Goiânia</h2>
            <div class="last-update" id="lastUpdate">⏳ Carregando dados...</div>
        </header>

        <div class="controls">
            <label class="control-label">Categoria:</label>
            <select id="categorySelect" onchange="updateDisplay()">
                <option value="">-- Todas --</option>
            </select>
        </div>

        <!-- VERSÃO DESKTOP: TABELA -->
        <div class="table-container">
            <table id="rankingTable">
                <thead>
                    <tr>
                        <th style="width: 8%;">Rank</th>
                        <th style="width: 35%;">Equipe</th>
                        <th style="width: 25%;">Tempo</th>
                        <th style="width: 12%;">Pontos</th>
                        <th style="width: 5%; text-align: center;">+</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <!-- VERSÃO MOBILE: CARDS -->
        <div id="cardsContainer" class="cards-container">
        </div>

        <div id="noData" class="no-data" style="display:none;">
            📋 Nenhum resultado finalizado ainda
        </div>

        <div class="refresh-info">
            🔄 Atualiza a cada 30 segundos
        </div>
    </div>

    <script>
        // URL do CSV publicado
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ8rMHFvBx4d4nC7sytJYKZ4RXIJdzktA4EgyG_LAiYiIXh_Sv6GFO9DUXQNJIgQ/pub?gid=259301029&single=true&output=csv';
        
        const CATEGORIES = [
            "Full Feminino",
            "Full Masculino",
            "Full Misto",
            "Revezamento Feminino",
            "Revezamento Masculino",
            "Revezamento Misto",
            "Short Feminino",
            "Short Masculino",
            "Short Misto"
        ];

        let allData = [];

        // Converter tempo MM:SS em segundos
        function timeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            const minutes = parseInt(parts[0]) || 0;
            const seconds = parseInt(parts[1]) || 0;
            return minutes * 60 + seconds;
        }

        // Calcular pontos
        function calculatePoints(position) {
            if (position === 1) return 100;
            if (position === 2) return 95;
            if (position === 3) return 90;
            return Math.max(0, 100 - (position - 1) * 5);
        }

        // Buscar dados
        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                
                const lines = csv.split('\n');
                allData = [];
                
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    const parts = lines[i].split(',');
                    if (parts.length >= 5 && parts[0]) {
                        allData.push({
                            id: parts[0].trim(),
                            equipe: parts[1].trim(),
                            categoria: parts[2].trim(),
                            tempo: parts[3].trim(),
                            status: parts[4] ? parts[4].trim() : '',
                            atleta1: parts[5] ? parts[5].trim() : 'N/A',
                            atleta2: parts[6] ? parts[6].trim() : 'N/A'
                        });
                    }
                }
                
                populateDropdown();
                updateLastModified();
                
            } catch (error) {
                console.error('Erro:', error);
                document.getElementById('lastUpdate').textContent = `❌ Erro ao carregar`;
            }
        }

        // Preencher dropdown
        function populateDropdown() {
            const select = document.getElementById('categorySelect');
            const currentValue = select.value;
            
            while (select.options.length > 1) {
                select.remove(1);
            }

            const categoriasComDados = new Set();
            allData.forEach(item => {
                if (item.categoria && item.status === "Finalizado") {
                    categoriasComDados.add(item.categoria);
                }
            });

            CATEGORIES.forEach(cat => {
                if (categoriasComDados.has(cat)) {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                }
            });

            select.value = currentValue;
        }

        // Atualizar display
        function updateDisplay() {
            const categorySelect = document.getElementById('categorySelect');
            const selectedCategory = categorySelect.value;

            let categoryData = allData.filter(row => row.status === "Finalizado");

            if (selectedCategory) {
                categoryData = categoryData.filter(row => row.categoria === selectedCategory);
            }

            categoryData.sort((a, b) => timeToSeconds(a.tempo) - timeToSeconds(b.tempo));

            const tableBody = document.getElementById('tableBody');
            const cardsContainer = document.getElementById('cardsContainer');
            const noData = document.getElementById('noData');

            if (categoryData.length === 0) {
                tableBody.innerHTML = '';
                cardsContainer.innerHTML = '';
                noData.style.display = 'block';
                return;
            }

            noData.style.display = 'none';
            tableBody.innerHTML = '';
            cardsContainer.innerHTML = '';

            categoryData.forEach((row, index) => {
                const position = index + 1;
                const points = calculatePoints(position);
                let medal = '';
                let rankClass = '';

                if (position === 1) {
                    medal = '🥇';
                    rankClass = 'first';
                } else if (position === 2) {
                    medal = '🥈';
                    rankClass = 'second';
                } else if (position === 3) {
                    medal = '🥉';
                    rankClass = 'third';
                }

                // VERSÃO DESKTOP
                const mainRow = document.createElement('tr');
                mainRow.innerHTML = `
                    <td class="rank ${rankClass}">
                        <span class="medal">${medal}</span>${position}
                    </td>
                    <td>
                        <div class="team-name">${row.equipe}</div>
                        <div class="category">${row.categoria}</div>
                    </td>
                    <td class="time">⏱️ ${row.tempo}</td>
                    <td class="points">${points}</td>
                    <td style="text-align: center;">
                        <span class="expand-icon" onclick="toggleDetails(event, this)">▼</span>
                    </td>
                `;
                tableBody.appendChild(mainRow);

                // VERSÃO MOBILE: CARD
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="rank-badge ${rankClass}">
                            <span class="medal">${medal}</span>
                            ${position}º
                        </div>
                        <button class="expand-btn" onclick="toggleCard(this)">+ Info</button>
                    </div>
                    <div class="card-title">${row.equipe}</div>
                    <div class="card-subtitle">${row.categoria}</div>
                    <div class="card-info">
                        <div class="info-item">
                            <div class="info-label">Tempo</div>
                            <div class="info-value">⏱️ ${row.tempo}</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Pontos</div>
                            <div class="info-value points">⭐ ${points}</div>
                        </div>
                    </div>
                    <div class="card-details">
                        <div class="athletes-grid">
                            <div class="athlete">
                                <div class="athlete-label">Atleta 1</div>
                                <div class="athlete-name">${row.atleta1}</div>
                            </div>
                            <div class="athlete">
                                <div class="athlete-label">Atleta 2</div>
                                <div class="athlete-name">${row.atleta2}</div>
                            </div>
                        </div>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        // Toggle card
        function toggleCard(btn) {
            const card = btn.closest('.card');
            const details = card.querySelector('.card-details');
            details.classList.toggle('show');
            btn.textContent = details.classList.contains('show') ? '- Info' : '+ Info';
        }

        // Toggle detalhes (desktop)
        function toggleDetails(event, icon) {
            // Implementação para desktop se necessário
        }

        // Atualizar hora
        function updateLastModified() {
            const now = new Date();
            const time = now.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').textContent = `✅ Atualizado em ${time}`;
        }

        // Inicializar
        fetchData();
        setInterval(fetchData, 30 * 1000);
    </script>
</body>
</html>
