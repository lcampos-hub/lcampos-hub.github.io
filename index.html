<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 INTER GAMES - A Batalha dos 100</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5em;
            color: #FF5722;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2em;
            color: #CCC;
            margin-bottom: 20px;
        }

        .last-update {
            font-size: 0.9em;
            color: #00FF00;
            margin-top: 10px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-label {
            color: #FF5722;
            font-weight: bold;
            font-size: 1.1em;
        }

        select {
            padding: 12px 20px;
            font-size: 1em;
            border: 2px solid #FF5722;
            background: #1A1A1A;
            color: #FF5722;
            border-radius: 5px;
            cursor: pointer;
            min-width: 250px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        select:hover {
            background: #2D2D2D;
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
        }

        select:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(255, 87, 34, 0.5);
        }

        select option {
            background: #1A1A1A;
            color: #FF5722;
        }

        .ranking-container {
            background: rgba(255, 87, 34, 0.1);
            border: 2px solid #FF5722;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(255, 87, 34, 0.2);
            min-height: 400px;
        }

        .category-title {
            background: #FF5722;
            color: #fff;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1.3em;
            margin-bottom: 25px;
            text-align: center;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
            border-left: 5px solid #FF5722;
            transition: all 0.3s ease;
        }

        .ranking-item:hover {
            background: rgba(255, 87, 34, 0.2);
            transform: translateX(5px);
        }

        .position {
            font-size: 1.8em;
            font-weight: bold;
            min-width: 60px;
            text-align: center;
            margin-right: 20px;
        }

        .medal {
            font-size: 2em;
            margin-right: 10px;
        }

        .team-info {
            flex: 1;
        }

        .team-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
            color: #FFF;
        }

        .team-time {
            font-size: 0.95em;
            color: #FF5722;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-style: italic;
            font-size: 1.1em;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #FF5722;
            font-size: 1.1em;
        }

        .refresh-info {
            text-align: center;
            color: #999;
            margin-top: 40px;
            font-size: 0.9em;
        }

        .podium {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            align-items: flex-end;
        }

        .podium-item {
            text-align: center;
            padding: 20px;
            background: rgba(255, 87, 34, 0.1);
            border-radius: 10px;
            border: 2px solid #FF5722;
        }

        .podium-medal {
            font-size: 3em;
            margin-bottom: 10px;
        }

        .podium-name {
            font-weight: bold;
            font-size: 0.95em;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .podium-time {
            color: #FF5722;
            font-weight: bold;
            font-size: 0.9em;
        }

        .podium-position {
            font-size: 1.2em;
            color: #FF5722;
            margin-top: 10px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            select {
                min-width: 100%;
            }

            .podium {
                grid-template-columns: 1fr;
                align-items: center;
            }

            .ranking-container {
                padding: 20px;
            }
        }

        .gold { color: #FFD700; }
        .silver { color: #C0C0C0; }
        .bronze { color: #CD7F32; }

        .pulse {
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏆 INTER GAMES experience</h1>
            <h2 class="subtitle">A Batalha dos 100 - Roque Box Goiânia</h2>
            <div class="last-update" id="lastUpdate">⏳ Carregando dados...</div>
        </header>

        <div class="controls">
            <label class="control-label">Selecione a Categoria:</label>
            <select id="categorySelect" onchange="updateDisplay()">
                <option value="">-- Escolha uma categoria --</option>
            </select>
        </div>

        <div class="ranking-container">
            <div id="categoryTitle" class="category-title">Escolha uma categoria acima</div>
            
            <div id="podium" class="podium"></div>
            
            <div id="rankingList"></div>
        </div>

        <div class="refresh-info">
            🔄 Atualiza automaticamente a cada 30 segundos<br>
            📊 Dados originários de Google Sheets
        </div>
    </div>

    <script>
        // URL do CSV publicado
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSJ8rMHFvBx4d4nC7sytJYKZ4RXIJdzktA4EgyG_LAiYiIXh_Sv6GFO9DUXQNJIgQ/pub?gid=259301029&single=true&output=csv';
        
        const CATEGORIES = [
            "Full Feminino",
            "Full Masculino",
            "Full Misto",
            "Revezamento Feminino",
            "Revezamento Masculino",
            "Revezamento Misto",
            "Short Feminino",
            "Short Masculino",
            "Short Misto"
        ];

        let allData = [];

        // Converter tempo MM:SS em segundos para ordenar
        function timeToSeconds(timeStr) {
            if (!timeStr) return Infinity;
            const parts = timeStr.split(':');
            const minutes = parseInt(parts[0]) || 0;
            const seconds = parseInt(parts[1]) || 0;
            return minutes * 60 + seconds;
        }

        // Buscar dados via CSV
        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csv = await response.text();
                
                const lines = csv.split('\n');
                allData = [];
                
                // Pular header (linha 0)
                for (let i = 1; i < lines.length; i++) {
                    if (lines[i].trim() === '') continue;
                    
                    const parts = lines[i].split(',');
                    if (parts.length >= 5 && parts[0]) {
                        allData.push({
                            id: parts[0].trim(),
                            equipe: parts[1].trim(),
                            categoria: parts[2].trim(),
                            tempo: parts[3].trim(),
                            status: parts[4] ? parts[4].trim() : ''
                        });
                    }
                }
                
                populateDropdown();
                updateLastModified();
                
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                document.getElementById('lastUpdate').textContent = `❌ Erro ao carregar. Tentando novamente...`;
            }
        }

        // Preencher dropdown com categorias
        function populateDropdown() {
            const select = document.getElementById('categorySelect');
            
            // Limpar opções antigas (manter a primeira)
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Adicionar categorias que têm dados
            const categoriasComDados = new Set();
            allData.forEach(item => {
                if (item.categoria && item.status === "Finalizado") {
                    categoriasComDados.add(item.categoria);
                }
            });

            // Ordenar por ordem das CATEGORIES
            CATEGORIES.forEach(cat => {
                if (categoriasComDados.has(cat)) {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                }
            });
        }

        // Atualizar display
        function updateDisplay() {
            const categorySelect = document.getElementById('categorySelect');
            const selectedCategory = categorySelect.value;

            if (!selectedCategory) {
                document.getElementById('categoryTitle').textContent = 'Escolha uma categoria acima';
                document.getElementById('podium').innerHTML = '';
                document.getElementById('rankingList').innerHTML = '';
                return;
            }

            const categoryData = allData
                .filter(row => row.categoria === selectedCategory && row.status === "Finalizado")
                .sort((a, b) => timeToSeconds(a.tempo) - timeToSeconds(b.tempo));

            document.getElementById('categoryTitle').textContent = selectedCategory;

            // Mostrar pódio (3 primeiros)
            if (categoryData.length >= 1) {
                let podiumHTML = '';
                
                for (let i = 0; i < Math.min(3, categoryData.length); i++) {
                    const row = categoryData[i];
                    let medal = '';
                    let medalClass = '';
                    let position = '';

                    if (i === 0) {
                        medal = '🥇';
                        medalClass = 'gold';
                        position = '1º LUGAR';
                    } else if (i === 1) {
                        medal = '🥈';
                        medalClass = 'silver';
                        position = '2º LUGAR';
                    } else if (i === 2) {
                        medal = '🥉';
                        medalClass = 'bronze';
                        position = '3º LUGAR';
                    }

                    podiumHTML += `
                        <div class="podium-item">
                            <div class="podium-medal">${medal}</div>
                            <div class="podium-name">${row.equipe}</div>
                            <div class="podium-time">⏱️ ${row.tempo}</div>
                            <div class="podium-position ${medalClass}">${position}</div>
                        </div>
                    `;
                }

                document.getElementById('podium').innerHTML = podiumHTML;
            } else {
                document.getElementById('podium').innerHTML = '';
            }

            // Mostrar ranking completo (a partir do 4º)
            let rankingHTML = '';

            if (categoryData.length > 3) {
                for (let i = 3; i < categoryData.length; i++) {
                    const row = categoryData[i];
                    const position = i + 1;

                    rankingHTML += `
                        <div class="ranking-item">
                            <div class="position">${position}º</div>
                            <div class="team-info">
                                <div class="team-name">${row.equipe}</div>
                                <div class="team-time">⏱️ ${row.tempo}</div>
                            </div>
                        </div>
                    `;
                }
            } else if (categoryData.length === 0) {
                rankingHTML = '<div class="no-data">Sem dados ainda nesta categoria</div>';
            }

            document.getElementById('rankingList').innerHTML = rankingHTML;
        }

        // Atualizar hora da última sincronização
        function updateLastModified() {
            const now = new Date();
            const time = now.toLocaleTimeString('pt-BR');
            document.getElementById('lastUpdate').textContent = `✅ Atualizado em ${time}`;
        }

        // Carregar dados ao abrir a página
        fetchData();

        // Atualizar a cada 30 segundos (30000 ms)
        setInterval(fetchData, 30 * 1000);
    </script>
</body>
</html>
